<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- BINK 不锈钢定制 Logo -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo 背景 -->
  <rect width="200" height="60" rx="8" fill="white" opacity="0.9"/>
  
  <!-- BINK 文字 -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#blueGradient)">
    BINK
  </text>
  
  <!-- 不锈钢定制 文字 -->
  <text x="85" y="28" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="url(#steelGradient)">
    不锈钢定制
  </text>
  
  <!-- AI助手 文字 -->
  <text x="85" y="48" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#7f8c8d">
    AI客户服务助手
  </text>
  
  <!-- 装饰线条 -->
  <line x1="80" y1="15" x2="80" y2="45" stroke="url(#blueGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- AI 图标 -->
  <circle cx="175" cy="25" r="8" fill="url(#blueGradient)" opacity="0.8"/>
  <text x="175" y="29" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">
    AI
  </text>
</svg>